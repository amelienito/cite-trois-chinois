name: Vérification Wikidata (hebdomadaire)
on:
  schedule: [{ cron: "0 5 * * 1" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Vérifier toute la base et mettre à jour les statuts
        run: node scripts/verify.mjs --write --untried --limit 2500
      - name: Reconstruire le site (les personnes rejetées sortent du jeu)
        run: node scripts/build.mjs
      - name: Enregistrer le résultat
        run: |
          git config user.name "verification-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet && exit 0
          git commit -m "Vérification Wikidata du $(date +%F)"
          git pull --rebase origin main
          git push
