name: Tester la reconnaissance des noms (réseau réel)
on:
  workflow_dispatch:
    inputs:
      live: { description: "Interroger Wikidata pour les noms absents de la base", default: "true" }
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Installer le navigateur de test
        run: npm i --no-save playwright@1.56.0 && npx playwright install --with-deps chromium
      - name: Mesurer
        run: |
          python3 -m http.server 8000 >/dev/null 2>&1 &
          sleep 2
          node tests/recherche.cjs http://localhost:8000/docs/index.html ${{ inputs.live == 'true' && '--live' || '' }} | tee resultat.txt
          tail -1 resultat.txt >> "$GITHUB_STEP_SUMMARY"
